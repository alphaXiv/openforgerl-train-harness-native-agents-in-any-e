  <line x1="420" y1="95" x2="420" y2="420" class="grid"/><line x1="620" y1="95" x2="620" y2="420" class="grid"/><line x1="820" y1="95" x2="820" y2="420" class="grid"/>
  <text x="215" y="448" class="t small">0×</text><text x="413" y="448" class="t small">1×</text><text x="613" y="448" class="t small">2×</text><text x="813" y="448" class="t small">3×</text>
  <line x1="420" y1="95" x2="420" y2="420" stroke="#172033" stroke-width="2" stroke-dasharray="6 5"/><text x="430" y="116" class="t small">direct baseline</text>
  <text x="48" y="165" class="t label">Prompt tokens</text><rect x="220" y="140" width="528" height="36" rx="5" fill="#f59e0b"/><text x="762" y="165" class="t value">2.64×</text>
  <text x="48" y="245" class="t label">Model calls</text><rect x="220" y="220" width="522" height="36" rx="5" fill="#f59e0b"/><text x="756" y="245" class="t value">2.61×</text>
