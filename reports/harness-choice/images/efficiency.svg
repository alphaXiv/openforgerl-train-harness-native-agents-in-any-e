  <text x="48" y="405" class="t label">Model latency</text><rect x="220" y="380" width="254" height="36" rx="5" fill="#fbbf24"/><text x="488" y="405" class="t value">1.27×</text>
  <text x="48" y="480" class="t small">Raw means: 13,584 vs 5,156 prompt tokens; 20.9 vs 8.0 model calls; 9.8 vs 7.0 tool turns; 7.46 vs 5.86 seconds model latency.</text>
