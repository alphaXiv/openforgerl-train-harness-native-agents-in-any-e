<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
  <rect width="1000" height="500" fill="#fff"/>
  <style>.t{font-family:Inter,Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.label{font-size:17px}.small{font-size:14px;fill:#536079}.value{font-size:17px;font-weight:700}.grid{stroke:#dbe2ea}</style>
  <text x="48" y="42" class="t title">Stateful orchestration consumed more work</text>
  <text x="48" y="68" class="t small">Ratio: stateful ÷ direct in the full-context, verification-on comparison</text>
